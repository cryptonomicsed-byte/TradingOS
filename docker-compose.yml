services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: tradingos-postgres
    environment:
      POSTGRES_USER: tradingos
      POSTGRES_PASSWORD: tradingos_password
      POSTGRES_DB: tradingos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: tradingos-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  kafka:
    image: bitnami/kafka:3.7
    container_name: tradingos-kafka
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/bitnami/kafka

  neo4j:
    image: neo4j:5-community
    container_name: tradingos-neo4j
    environment:
      - NEO4J_AUTH=neo4j/password
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  ollama:
    image: ollama/ollama:latest
    container_name: tradingos-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  vault:
    image: hashicorp/vault:latest
    container_name: tradingos-vault
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=root
      - VAULT_ADDR=http://0.0.0.0:8200
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK

  prometheus:
    image: prom/prometheus:latest
    container_name: tradingos-prometheus
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: tradingos-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana

  loki:
    image: grafana/loki:latest
    container_name: tradingos-loki
    ports:
      - "3100:3100"

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: tradingos-jaeger
    ports:
      - "16686:16686"
      - "14268:14268"
      - "4317:4317" # OTLP gRPC

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  neo4j_data:
  ollama_data:
  grafana_data:
